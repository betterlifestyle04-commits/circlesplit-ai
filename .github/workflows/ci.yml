name: Test CircleSplit AI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --check static/insights.js
      - run: node --test tests/test_insights.cjs tests/test_operations.cjs tests/test_pulse.cjs tests/test_communications.cjs tests/test_directory.cjs tests/test_categories.cjs tests/test_planning.cjs
      - run: node --check static/planning.js
      - run: node --check static/categories.js
      - run: node --check static/directory.js
      - run: node --check static/communications.js
      - run: node --check static/pulse.js
      - run: node --check static/operations.js
      - name: Validate protected workspace inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("static/index.html").read_text()
          scripts=re.findall(r"<script>([\s\S]*?)</script>",s)
          assert len(scripts)==1
          Path("/tmp/circlesplit-inline.js").write_text(scripts[0])
          PY
          node --check /tmp/circlesplit-inline.js
      - run: python -m compileall -q app.py domain.py paypal.py
