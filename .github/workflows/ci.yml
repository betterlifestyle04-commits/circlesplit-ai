name: Test CircleSplit AI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-ops.txt
      - run: python -m pytest -q
      - run: node --check static/insights.js
      - run: node --check static/public_recovery.js
      - run: node --check static/public_portability.js
      - run: node --check static/public_scenarios.js
      - run: node --check static/recovery_triage.js
      - run: node --check static/webhook_audit.js
      - run: node --test tests/test_insights.cjs tests/test_operations.cjs tests/test_pulse.cjs tests/test_communications.cjs tests/test_directory.cjs tests/test_categories.cjs tests/test_planning.cjs tests/test_closeout.cjs tests/test_backup.cjs tests/test_templates.cjs tests/test_editing.cjs tests/test_event_details.cjs tests/test_schedule.cjs tests/test_participant_session.cjs tests/test_recovery_ui.cjs tests/test_reconciliation_ui.cjs tests/test_global_ledger_audit_ui.cjs tests/test_reconciliation_compare.cjs tests/test_reconciliation_compare_ui.cjs tests/test_judge_walkthrough.cjs tests/test_checkout_preflight_ui.cjs tests/test_payment_return_ui.cjs tests/test_storage_continuity.cjs tests/test_affordability_ui.cjs tests/test_attendance_risk_ui.cjs tests/test_public_recovery.cjs tests/test_recovery_triage_ui.cjs tests/test_sandbox_role_ui.cjs tests/test_webhook_audit_ui.cjs tests/test_public_portability.cjs tests/test_public_scenarios.cjs tests/test_public_comparison.cjs
      - run: node --check static/reconciliation_compare.js
      - run: node --check static/storage_continuity.js
      - run: node --check static/judge_walkthrough.js
      - run: node --check static/schedule.js
      - run: node --check static/event-details.js
      - run: node --check static/editing.js
      - run: node --check static/templates.js
      - run: node --check static/backup.js
      - run: node --check static/closeout.js
      - run: node --check static/planning.js
      - run: node --check static/categories.js
      - run: node --check static/directory.js
      - run: node --check static/communications.js
      - run: node --check static/pulse.js
      - run: node --check static/operations.js
      - name: Validate protected workspace inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("static/index.html").read_text()
          scripts=re.findall(r"<script>([\s\S]*?)</script>",s)
          assert len(scripts)==1
          Path("/tmp/circlesplit-inline.js").write_text(scripts[0])
          PY
          node --check /tmp/circlesplit-inline.js
      - name: Validate public browser demo inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source=Path("static/public.html").read_text()
          scripts=re.findall(r"<script>([\s\S]*?)</script>",source)
          assert len(scripts)==1
          Path("/tmp/circlesplit-public-inline.js").write_text(scripts[0])
          PY
          node --check /tmp/circlesplit-public-inline.js
      - name: Validate participant portal inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("static/participant.html").read_text()
          scripts=re.findall(r"<script>([\s\S]*?)</script>",s)
          assert len(scripts)==1
          Path("/tmp/circlesplit-participant-inline.js").write_text(scripts[0])
          PY
          node --check /tmp/circlesplit-participant-inline.js
      - run: python -m compileall -q app.py domain.py paypal.py calendar_export.py csp.py judge_access.py security.py provider_limits.py storage_readiness.py ledger_audit.py recovery_triage.py webhook_audit.py attendance_risk.py tools/sqlite_snapshot.py tools/encrypted_snapshot.py tools/verify_live.py tools/submission_preflight.py

  # Main-branch releases are checked *after* unit tests, with no secrets.
  # The smoke checker polls only while Render is deploying/waking.
  # Wrong auth boundaries, malformed data and missing public scripts fail fast.
  live_smoke:
    name: Live public release and authentication gate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check hosted source revision, public scripts and Basic-auth boundaries
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python tools/verify_live.py --expected-sha "$EXPECTED_COMMIT" --attempts 30 --delay 8 --timeout 10
          {
            echo "### CircleSplit public release gate: PASS"
            echo ""
            echo "- Exact revision: \`$EXPECTED_COMMIT\`"
            echo "- Public guest, judge and participant pages: HTTP 200"
            echo "- Four public JavaScript modules: HTTP 200 with no-store"
            echo "- Private workspace, static files and payment diagnostics: HTTP 401"
            echo "- Anonymous GET only; zero PayPal operations and no credentials"
            echo "- **Not verified:** durable database, Gemini, Sandbox checkout, or real-user authentication"
          } >> "$GITHUB_STEP_SUMMARY"
