name: Test CircleSplit AI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --check static/insights.js
      - run: node --test tests/test_insights.cjs tests/test_operations.cjs tests/test_pulse.cjs tests/test_communications.cjs tests/test_directory.cjs tests/test_categories.cjs tests/test_planning.cjs tests/test_closeout.cjs tests/test_backup.cjs tests/test_templates.cjs tests/test_editing.cjs tests/test_event_details.cjs tests/test_schedule.cjs tests/test_participant_session.cjs tests/test_recovery_ui.cjs tests/test_reconciliation_ui.cjs tests/test_global_ledger_audit_ui.cjs tests/test_reconciliation_compare.cjs tests/test_reconciliation_compare_ui.cjs tests/test_judge_walkthrough.cjs tests/test_checkout_preflight_ui.cjs tests/test_payment_return_ui.cjs tests/test_storage_continuity.cjs
      - run: node --check static/reconciliation_compare.js
      - run: node --check static/storage_continuity.js
      - run: node --check static/judge_walkthrough.js
      - run: node --check static/schedule.js
      - run: node --check static/event-details.js
      - run: node --check static/editing.js
      - run: node --check static/templates.js
      - run: node --check static/backup.js
      - run: node --check static/closeout.js
      - run: node --check static/planning.js
      - run: node --check static/categories.js
      - run: node --check static/directory.js
      - run: node --check static/communications.js
      - run: node --check static/pulse.js
      - run: node --check static/operations.js
      - name: Validate protected workspace inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("static/index.html").read_text()
          scripts=re.findall(r"<script>([\s\S]*?)</script>",s)
          assert len(scripts)==1
          Path("/tmp/circlesplit-inline.js").write_text(scripts[0])
          PY
          node --check /tmp/circlesplit-inline.js
      - name: Validate participant portal inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("static/participant.html").read_text()
          scripts=re.findall(r"<script>([\s\S]*?)</script>",s)
          assert len(scripts)==1
          Path("/tmp/circlesplit-participant-inline.js").write_text(scripts[0])
          PY
          node --check /tmp/circlesplit-participant-inline.js
      - run: python -m compileall -q app.py domain.py paypal.py calendar_export.py security.py provider_limits.py storage_readiness.py ledger_audit.py
